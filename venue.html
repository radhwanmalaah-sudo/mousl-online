<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#A6311A">
<title>قائمة الصالة</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Lalezar&display=swap">
<style>
:root {
  --bg: #EEF1EE; --surface: #FFFFFF; --surface-2: #E3E9E5; --ink: #17201D; --ink-2: #52605B;
  --line: #D1D9D4; --tea: #A6311A; --tea-ink: #FFFFFF; --ok: #0E6B5F;
  --font-display: 'Lalezar', sans-serif; --font-body: 'IBM Plex Sans Arabic', sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #0F1514; --surface: #172120; --surface-2: #1F2C2A; --ink: #E7EEEB; --ink-2: #9DB0AA;
    --line: #2A3A37; --tea: #E5755A; --tea-ink: #1A0A06; color-scheme: dark; }
}
* { box-sizing: border-box; }
.preview-bar {
  position: sticky; top: 0; z-index: 50;
  background: var(--tea); color: var(--tea-ink);
  padding: 10px 14px; display: flex; justify-content: space-between; align-items: center;
  font-weight: 600; font-size: 14px;
}
.preview-bar button {
  background: #fff; color: var(--tea); border: 0; border-radius: 10px;
  padding: 6px 14px; font-weight: 600; cursor: pointer;
}
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.55; padding: 0 0 110px; overflow-x: hidden; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
.app { max-width: 480px; margin-inline: auto; padding: 0 max(14px, env(safe-area-inset-right)) 0 max(14px, env(safe-area-inset-left)); min-height: 100vh; background: var(--bg); }
@media (min-width: 700px) {
  body { background: var(--surface-2); }
  .app { box-shadow: 0 0 40px rgba(0,0,0,.12); }
}
.cover { margin: 0 -14px; aspect-ratio: 16 / 5; background: linear-gradient(135deg, var(--tea), #5b1a0d); background-size: cover; background-position: center; }
.hinfo { display: flex; align-items: flex-start; gap: 12px; position: relative; }
.logo { flex: 0 0 auto; margin-top: -34px; width: 68px; height: 68px; border-radius: 50%; border: 3px solid var(--bg); background: var(--tea); overflow: hidden; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 30px; font-weight: 700; box-shadow: 0 2px 8px rgba(0,0,0,.18); }
.logo img { width: 100%; height: 100%; object-fit: cover; }
.htxt { min-width: 0; margin-top: 8px; }
.htxt .brand { margin: 0; font-size: 28px; line-height: 1.15; }
.meta2 { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: 4px; font-size: 13px; color: var(--ink-2); }
.status { display: inline-flex; align-items: center; gap: 5px; border-radius: 999px; padding: 2px 10px; font-size: 12px; font-weight: 600; background: #DDF1EC; color: #0E6B5F; }
.status::before { content: ''; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.status.off { background: #F6DEDA; color: #A6311A; }
.steps { display: flex; gap: 6px; list-style: none; padding: 0; margin: 12px 0 12px; font-size: 12px; }
.steps li { flex: 1; text-align: center; padding: 6px 4px; border-radius: 10px; background: var(--surface-2); color: var(--ink-2); }
.steps li.on { background: var(--tea); color: var(--tea-ink); font-weight: 600; }
.steps li.done { background: #DDF1EC; color: #0E6B5F; }
.tgrid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.tbtn { aspect-ratio: 1 / 1; border: 1px solid var(--line); background: var(--surface); border-radius: 14px; font-size: 20px; font-weight: 700; color: var(--ok); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0; padding: 0; }
.tbtn small { font-size: 10px; font-weight: 500; color: var(--ink-2); }
.tbtn:active { transform: scale(.96); }
.tbtn.last { border-color: var(--tea); box-shadow: 0 0 0 2px var(--tea) inset; }
.tbtn:disabled { background: var(--surface-2); color: var(--ink-2); opacity: .7; cursor: not-allowed; }
.callrow { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 4px 0 8px; }
.callrow .btn-line { padding: 9px 8px; font-size: 14px; }
.callrow .wide { grid-column: 1 / -1; }
.trk { overflow: hidden; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 10px 12px; margin-bottom: 8px; }
.trk .tl { font-size: 13px; color: var(--ink-2); margin-bottom: 8px; }
.prog { display: flex; align-items: center; }
.prog span { flex: 1; text-align: center; font-size: 11px; color: var(--ink-2); position: relative; padding-top: 16px; }
.prog span::before { content: ''; position: absolute; top: 3px; left: 50%; transform: translateX(-50%); width: 10px; height: 10px; border-radius: 50%; background: var(--line); z-index: 1; }
.prog span::after { content: ''; position: absolute; top: 7px; left: 50%; width: 100%; height: 2px; background: var(--line); }
.prog span:first-child::after { display: none; }
.prog span.on { color: var(--ink); font-weight: 600; }
.prog span.on::before { background: var(--ok); }
.prog span.on::after { background: var(--ok); }
.trk.bad { border-color: #E5B7AE; }

.brand { font-family: var(--font-display); font-size: 30px; color: var(--tea); margin: 16px 0 4px; }
.sub { color: var(--ink-2); font-size: 14px; margin-bottom: 14px; }
h2 { font-size: 13px; font-weight: 600; color: var(--ink-2); margin: 18px 0 8px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 12px 14px; margin-bottom: 8px; }
.row { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.name { font-weight: 600; }
.price { font-weight: 600; direction: ltr; unicode-bidi: isolate; }
.meta { color: var(--ink-2); font-size: 13px; }
.btn { background: var(--tea); color: var(--tea-ink); border: 0; border-radius: 12px; padding: 12px 18px; font-weight: 600; width: 100%; }
.btn:disabled { opacity: 0.45; }
.btn-line { background: transparent; border: 1px solid var(--line); border-radius: 10px; padding: 6px 12px; }
.qty { display: inline-flex; align-items: center; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.qty button { border: 0; background: var(--surface-2); padding: 4px 12px; }
.qty output { min-width: 1.8em; text-align: center; }
.in { width: 100%; background: var(--bg); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; }
.err { color: var(--tea); font-size: 13px; min-height: 1.2em; }
.note { color: var(--ink-2); font-size: 13px; }
.bar { position: fixed; bottom: 0; left: 0; right: 0; background: var(--surface); border-top: 1px solid var(--line);
  padding: 10px max(14px, env(safe-area-inset-right)) calc(10px + env(safe-area-inset-bottom)) max(14px, env(safe-area-inset-left));
  display: flex; gap: 10px; align-items: center; max-width: 520px; margin-inline: auto; }
.bar b { flex: 1; }
.pill { display: inline-block; background: var(--surface-2); border-radius: 999px; padding: 2px 10px; font-size: 12px; font-weight: 600; }
.empty { text-align: center; color: var(--ink-2); padding: 24px; }

.srch { margin-bottom: 8px; }
.cats { display: flex; gap: 8px; overflow-x: auto; padding: 2px 0 10px; scrollbar-width: none; }
.cats::-webkit-scrollbar { display: none; }
.chip { flex: 0 0 auto; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 14px; font-size: 14px; white-space: nowrap; }
.chip[aria-pressed="true"] { background: var(--tea); color: var(--tea-ink); border-color: var(--tea); font-weight: 600; }
.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.pcard { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 8px; display: flex; flex-direction: column; gap: 4px; }
.thumb { position: relative; aspect-ratio: 1 / 1; border-radius: 12px; overflow: hidden; }
.thumb .ini { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 44px; font-weight: 700; }
.thumb img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.pname { font-weight: 600; font-size: 14px; line-height: 1.3; }
.pdesc { color: var(--ink-2); font-size: 12px; line-height: 1.3; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; min-height: 2.6em; }
.prow { display: flex; justify-content: space-between; align-items: center; gap: 6px; margin-top: auto; min-height: 34px; }
.prow .price { font-size: 14px; }
.addbtn { width: 34px; height: 34px; border-radius: 50%; border: 0; background: var(--tea); color: var(--tea-ink); font-size: 22px; line-height: 1; padding: 0; }
.stp { display: inline-flex; align-items: center; background: var(--surface-2); border-radius: 999px; }
.stp button { width: 30px; height: 30px; border: 0; background: transparent; font-size: 18px; padding: 0; border-radius: 50%; }
.stp output { min-width: 1.4em; text-align: center; font-weight: 600; }
.sheet { position: fixed; inset: 0; z-index: 60; background: rgba(0,0,0,.45); display: flex; align-items: flex-end; justify-content: center; }
.sheet-in { background: var(--bg); width: 100%; max-width: 520px; max-height: 82vh; overflow-y: auto; border-radius: 20px 20px 0 0; padding: 14px 14px calc(16px + env(safe-area-inset-bottom)); }
.sline { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 8px 0; border-bottom: 1px solid var(--line); }
.sline .sn { flex: 1; font-weight: 600; }
.barinfo { flex: 1; text-align: start; background: none; border: 0; padding: 0; }
.barinfo b { display: block; }
.barinfo small { color: var(--ink-2); font-size: 12px; }
[hidden] { display: none !important; }
</style>
</head>
<body>
<div id="preview-bar" class="preview-bar" hidden>
  <span>معاينة صفحة الزبائن</span>
  <button type="button" id="btn-back">رجوع للإعدادات</button>
</div>
<div class="app">
  <header>
    <div class="cover" id="cover"></div>
    <div class="hinfo">
      <div class="logo" id="logo">م</div>
      <div class="htxt">
        <h1 class="brand" id="vname">الصالة</h1>
        <div class="meta2"><span class="status" id="vstat" hidden>مفتوح الآن</span><span id="vhours"></span></div>
      </div>
    </div>

  </header>
  <ol class="steps" id="steps" hidden>

  <div id="gate-table" hidden>

    <div class="callrow">

    </div>

    <p class="err" id="err" role="alert"></p>
  </div>

  <div id="done" hidden>
    <div class="card" style="text-align:center">
      <div class="brand" style="font-size:24px">تم إرسال الطلب</div>
      <p class="note">طلبك وصل للصالة على الطاولة <b id="done-tbl"></b>.</p>
      <p class="note">نجيبه لك للطاولة. تقدر تتابع حالته هنا.</p>
      <button class="btn" id="btn-more" style="margin-top:10px">أضف طلب ثاني</button>
      <div id="push-slot"></div>
    </div>
    <div id="done-track" style="margin-top:10px"></div>
    <div class="callrow">
      <button class="btn-line" type="button" data-act="call" data-t="waiter">🔔 نادي الويتر</button>
      <button class="btn-line" type="button" data-act="call" data-t="bill">🧾 اطلب الحساب</button>
      <button class="btn-line wide" type="button" data-act="call" data-t="leave">🚪 خلصت وراح أغادر</button>
    </div>
    <p class="note" id="callmsg2" role="status" hidden></p>
  </div>
</div>

<div class="bar" id="bar" hidden>
  <button class="barinfo" id="btn-cart" type="button" data-act="cart-open"><b id="total">المجموع: ٠</b><small id="barcnt">السلة فاضية</small></button>
  <button class="btn" id="btn-send" style="width:auto;padding:10px 18px" disabled>أرسل الطلب</button>
</div>

<div class="sheet" id="sheet" hidden>
  <div class="sheet-in">
    <div class="row"><h2 style="margin:0;font-size:16px;color:var(--ink)">طلبك</h2><button class="btn-line" type="button" data-act="cart-close">رجوع للقائمة</button></div>
    <div id="slines"></div>
    <div class="row" style="margin:12px 0"><b>المجموع</b><b class="price" id="stotal"></b></div>
    <button class="btn" type="button" id="btn-send2">أرسل الطلب</button>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>

<script src="push.js"></script>
<script>
var FBCONFIG = { apiKey: 'AIzaSyDT27G2lUpfUPcAMvRIPkllY3bzbQv87Eg', authDomain: 'chaychi-61eaf.firebaseapp.com', projectId: 'chaychi-61eaf', storageBucket: 'chaychi-61eaf.firebasestorage.app', messagingSenderId: '669532553284', appId: '1:669532553284:web:b999af1fc4824c7affbc11' };
var auth, db, fbOK = false;
try {
  firebase.initializeApp(FBCONFIG);
  auth = firebase.auth();
  db = firebase.firestore();
  fbOK = true;
} catch (e) { fbOK = false; }

function $(id) { return document.getElementById(id); }
function esc(t) { return String(t == null ? '' : t).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function ar(n) {
  if (n == null || n === '') return '';
  var num = Number(n);
  if (!isNaN(num) && isFinite(num)) {
    // أزل أخطاء الفاصلة العائمة (مثل 999.999999 → 1000)
    if (Math.abs(num - Math.round(num)) < 1e-9) num = Math.round(num);
    else num = Math.round(num * 100) / 100;
    n = String(num);
  } else {
    n = String(n);
  }
  return n.replace(/\d/g, function (d) { return '٠١٢٣٤٥٦٧٨٩'[d]; });
}
function westernDigits(s) {
  return String(s || '').replace(/[٠-٩]/g, function (d) {
    return String('٠١٢٣٤٥٦٧٨٩'.indexOf(d));
  }).replace(/[٬،\s,]/g, '');
}
function parsePrice(s) {
  var w = westernDigits(s).replace(/[^\d.]/g, '');
  if (!w || w === '.') return NaN;
  var n = Number(w);
  if (!isFinite(n) || isNaN(n)) return NaN;
  // دينار: خليه عدد صحيح؛ دولار: خليه مرتبتين
  if (Math.abs(n - Math.round(n)) < 1e-9) return Math.round(n);
  return Math.round(n * 100) / 100;
}
function normCode(c) { return String(c || '').trim().toUpperCase().replace(/[^A-Z0-9]/g, ''); }

var ad = null, adId = null, tableNo = 0, cart = {};

function ensureAuth() {
  return new Promise(function (res, rej) {
    if (!fbOK) { rej(new Error('firebase')); return; }
    if (auth.currentUser) { res(auth.currentUser); return; }
    auth.signInAnonymously().then(function (c) { res(c.user); }).catch(rej);
  });
}

function money(p, cur) {
  if (p == null || cur === 'none') return ar(p || 0);
  var n = Number(p);
  if (isNaN(n)) return '';
  return cur === 'usd' ? (n + ' $') : (ar(n) + ' د.ع');
}

function cartTotal() {
  var items = (ad && ad.items) || [], t = 0, cur = (ad && ad.currency) || 'iqd';
  items.forEach(function (it, i) {
    var q = cart[i] || 0;
    if (q) t += q * (Number(it.price) || 0);
  });
  return t;
}

function busySet() {
  var b = (ad && ad.busyTables) || [];
  var s = {};
  b.forEach(function (n) { s[Number(n)] = 1; });
  return s;
}
var IS_PREVIEW = /[?&]preview=1/.test(location.search);

function safeUrl(u) { return /^(data:image\/(jpeg|png|webp);base64,[A-Za-z0-9+\/=]+|https:\/\/[^\s"'<>]+)$/.test(String(u || '')) ? u : ''; }
function renderHero() {
  if (!ad) return;
  var nm = String(ad.shop || 'الصالة');
  $('vname').textContent = nm;
  var cv = safeUrl(ad.cover);
  $('cover').style.backgroundImage = cv ? 'url("' + cv + '")' : '';
  var lg = safeUrl(ad.logo);
  var L = $('logo');
  if (lg) { L.innerHTML = '<img alt="" src="' + esc(lg) + '">'; L.style.background = ''; }
  else { L.textContent = nm.charAt(0); L.style.background = 'hsl(' + hueOf(nm) + ',42%,40%)'; }
  var st = $('vstat'), closed = isClosed();
  st.hidden = false; st.textContent = closed ? 'مغلق حالياً' : 'مفتوح الآن'; st.className = 'status' + (closed ? ' off' : '');
  $('vhours').textContent = ad.hours ? 'الدوام: ' + ad.hours : '';
  $('vsub').textContent = closed ? 'الصالة ما تستقبل طلبات حالياً.' : (ad.text || 'اطلب من مكانك، ونجيبه لطاولتك');
  document.title = nm + ' — قائمة';
}
function setStep(n) {
  $('steps').hidden = false;
  ['st1', 'st2', 'st3'].forEach(function (id, k) { $(id).className = (k + 1 < n) ? 'done' : (k + 1 === n ? 'on' : ''); });
}
function renderTables() {
  var n = Math.max(1, Math.min(200, Number(ad.tableCount) || 10));
  var busy = busySet(), html = '', free = 0, kept = 0;
  try { kept = Number(localStorage.getItem('chaychi-venue-tbl-' + adId)) || 0; } catch (e) {}
  if (isClosed()) { $('tgrid').innerHTML = ''; var h0 = $('tbl-busy-hint'); h0.hidden = true; return; }
  for (var i = 1; i <= n; i++) {
    if (busy[i] && kept !== i) html += '<button type="button" class="tbtn" disabled aria-label="طاولة ' + i + ' مشغولة">' + ar(i) + '<small>مشغولة</small></button>';
    else { free++; html += '<button type="button" class="tbtn' + (kept === i ? ' last' : '') + '" data-act="tbl" data-n="' + i + '">' + ar(i) + (kept === i ? '<small>طاولتك</small>' : '') + '</button>'; }
  }
  $('tgrid').innerHTML = html;
  var hint = $('tbl-busy-hint'), nb = Object.keys(busy).length;
  hint.textContent = !free ? 'كل الطاولات مشغولة حالياً. حاول بعد قليل.' : (nb ? ar(nb) + ' طاولة مشغولة الآن.' : '');
  hint.hidden = !hint.textContent;
}
function pickTable(n) {
  if (isClosed()) return;
  var keptT = 0; try { keptT = Number(localStorage.getItem('chaychi-venue-tbl-' + adId)) || 0; } catch (e) {}
  if (busySet()[n] && keptT !== n) { $('vsub').textContent = 'طاولة ' + ar(n) + ' مشغولة. اختار طاولة ثانية.'; renderTables(); return; }
  tableNo = n;
  try { localStorage.setItem('chaychi-venue-tbl-' + adId, String(n)); } catch (e) {}
  cart = {}; showMenu();
}

var curCat = '', searchQ = '';
function hueOf(t) { var h = 0; t = String(t || ''); for (var i = 0; i < t.length; i++) h = (h * 31 + t.charCodeAt(i)) % 360; return h; }
function catOf(it) { return ((it && it.cat) || '').trim(); }
function stepperHtml(i, q) {
  return '<div class="stp"><button type="button" data-act="dec" data-i="' + i + '" aria-label="نقص">−</button><output>' + ar(q) + '</output><button type="button" data-act="inc" data-i="' + i + '" aria-label="زيادة">+</button></div>';
}
function renderMenu() {
  var items = ad.items || [];
  var cur = ad.currency || 'iqd';
  if (!items.length) {
    $('list').innerHTML = '<div class="empty" style="grid-column:1/-1">القائمة فاضية حالياً.</div>';
    $('cats').innerHTML = '';
    updateBar();

  }
  var cats = [], seen = {}, hasNone = false;
  items.forEach(function (it) { var c = catOf(it); if (!c) hasNone = true; else if (!seen[c]) { seen[c] = 1; cats.push(c); } });
  if (cats.length && hasNone) cats.push('أخرى');
  if (curCat && cats.indexOf(curCat) < 0) curCat = '';
  $('cats').hidden = !cats.length;
  $('cats').innerHTML = cats.length ? ['الكل'].concat(cats).map(function (c) {
    var val = c === 'الكل' ? '' : c;
    return '<button type="button" class="chip" data-act="cat" data-c="' + esc(val) + '" aria-pressed="' + (curCat === val) + '">' + esc(c) + '</button>';
  }).join('') : '';
  var q = searchQ.trim().toLowerCase(), shown = 0, html = '';
  items.forEach(function (it, i) {
    var c = catOf(it) || (cats.length ? 'أخرى' : '');
    if (curCat && c !== curCat) return;
    if (q && (String(it.name || '') + ' ' + String(it.desc || '')).toLowerCase().indexOf(q) < 0) return;
    shown++;
    var qn = cart[i] || 0, nm = String(it.name || '');
    html += '<div class="pcard"><div class="thumb" style="background:hsl(' + hueOf(nm) + ',42%,40%)">' +
      '<div class="ini">' + esc(nm.charAt(0)) + '</div>' +
      (it.img ? '<img src="' + esc(it.img) + '" alt="" loading="lazy" onerror="this.style.display=\'none\'">' : '') + '</div>' +
      '<div class="pname">' + esc(nm) + '</div>' +
      '<div class="pdesc">' + esc(it.desc || '') + '</div>' +
      '<div class="prow"><span class="price">' + (cur === 'none' ? '' : esc(money(it.price, cur))) + '</span>' +
      (qn > 0 ? stepperHtml(i, qn) : '<button type="button" class="addbtn" data-act="inc" data-i="' + i + '" aria-label="أضف">+</button>') +
      '</div></div>';
  });
  $('list').innerHTML = shown ? html : '<div class="empty" style="grid-column:1/-1">ماكو نتائج.</div>';
  updateBar();
}

function renderSheet() {
  var items = ad.items || [], cur = ad.currency || 'iqd', html = '';
  items.forEach(function (it, i) {
    var qn = cart[i] || 0; if (!qn) return;
    html += '<div class="sline"><span class="sn">' + esc(it.name) + '</span>' + stepperHtml(i, qn) +
      '<span class="price" style="min-width:5.5em;text-align:end">' + (cur === 'none' ? '' : esc(money(qn * (Number(it.price) || 0), cur))) + '</span></div>';
  });
  $('slines').innerHTML = html || '<div class="empty">السلة فاضية.</div>';
  $('stotal').textContent = cur === 'none' ? '' : money(cartTotal(), cur);
  $('btn-send2').disabled = !html;
}
function refreshAll() {
  renderMenu();
  if (!$('sheet').hidden) { renderSheet(); if (!cartCount()) $('sheet').hidden = true; }
}
function cartCount() { return Object.keys(cart).reduce(function (t, k) { return t + (cart[k] > 0 ? cart[k] : 0); }, 0); }

function updateBar() {
  var cur = (ad && ad.currency) || 'iqd';
  var n = cartCount();
  $('total').textContent = cur === 'none' ? (n ? 'طلبك جاهز' : 'السلة فاضية') : 'المجموع: ' + money(cartTotal(), cur);
  $('barcnt').textContent = n ? ar(n) + ' ' + (n === 1 ? 'صنف' : 'أصناف') + ' · اضغط لمراجعة الطلب' : 'اختار من القائمة';
  $('btn-send').disabled = !n || !tableNo;
  $('bar').hidden = !tableNo || $('menu').hidden;
}

function showMenu() {
  $('gate-table').hidden = true;
  $('menu').hidden = false;
  $('done').hidden = true;
  $('tbl-pill').textContent = 'أهلاً بك — طاولة ' + ar(tableNo);
  setStep(2);
  renderMenu();
  renderTrack();
  updateBar();
}

function loadVenue(id) {
  if (!/^[A-Za-z0-9]{6,40}$/.test(id || '')) { $('vsub').textContent = 'الرابط غير صحيح.'; return; }
  ensureAuth().then(function (u) {
    myUid = u.uid;
    return db.collection('ads').doc(id).get();
  }).then(function (doc) {
    if (!doc.exists) { $('vsub').textContent = 'ماكو صالة مرتبطة بهذا الرابط.'; return; }
    ad = doc.data(); adId = doc.id;
    if (ad.pageType !== 'venue') { $('vsub').textContent = 'هذا الرابط مو مخصص لصالة.'; return; }
    if (ad.active === false) { $('vsub').textContent = 'الصالة متوقفة حالياً.'; return; }
    renderHero();
    $('gate-table').hidden = false; setStep(1);
    renderTables();
    startTrack();
    if (window._unsubAd) { try { window._unsubAd(); } catch (e) {} }
    window._unsubAd = db.collection('ads').doc(adId).onSnapshot(function (snap) {
      if (!snap.exists) return;
      ad = snap.data(); ad.id = adId;
      renderHero();
      if (!tableNo) renderTables(); else renderMenu();
      updateBar();
    });
    // QR طاولة: ?t=5 أو ?table=5
    var tp = 0;
    try { var usp = new URLSearchParams(location.search); tp = Number(usp.get('t') || usp.get('table') || 0) || 0; } catch (e) {}
    var maxT = Math.max(1, Math.min(200, Number(ad.tableCount) || 10));
    if (tp >= 1 && tp <= maxT && !isClosed()) {
      var keptQ = 0; try { keptQ = Number(localStorage.getItem('chaychi-venue-tbl-' + adId)) || 0; } catch (e) {}
      if (busySet()[tp] && keptQ !== tp) $('vsub').textContent = 'طاولة ' + ar(tp) + ' مشغولة حالياً. اختار طاولة ثانية.';
      else pickTable(tp);
    }
  }).catch(function (e) {
    $('vsub').textContent = 'تعذر التحميل. تأكد من الإنترنت.';
  });
}

/* ---- tracking my orders ---- */
var myUid = '', myOrders = [], trackUnsub = null, lastStages = {};
var STAGES = ['تم الاستلام', 'قيد التحضير', 'جاهز', 'تم'];
function stageOf(st) { return { 'new': 0, open: 0, accepted: 1, ready: 2, delivered: 3, closed: 3 }[st]; }
function startTrack() {
  if (trackUnsub || !myUid || !adId) return;
  trackUnsub = db.collection('orders').where('customerUid', '==', myUid).where('adId', '==', adId).limit(20).onSnapshot(function (s) {
    var cut = Date.now() - 12 * 3600 * 1000;
    myOrders = s.docs.map(function (d) { var x = d.data(); x.id = d.id; return x; })
      .filter(function (o) { return o.kind === 'venue' && (o.createdAt || 0) > cut; })
      .sort(function (a, b) { return (b.createdAt || 0) - (a.createdAt || 0); });
    myOrders.forEach(function (o) {
      var sg = stageOf(o.status);
      if (lastStages[o.id] != null && sg === 2 && lastStages[o.id] !== 2) { try { if (navigator.vibrate) navigator.vibrate([200, 100, 200]); } catch (e) {} }
      lastStages[o.id] = sg;
    });
    renderTrack();
  }, function () {});
}
function trackHtml() {
  var cur = (ad && ad.currency) || 'iqd';
  var list = myOrders.filter(function (o) { return o.open !== false || o.status === 'delivered' || o.status === 'rejected' || o.status === 'cancelled'; }).slice(0, 3);
  if (!list.length) return '';
  return list.map(function (o) {
    var lines = (o.lines || []).map(function (l) { return esc(l.n) + ' × ' + ar(l.q); }).join(' · ');
    if (o.status === 'rejected' || o.status === 'cancelled') return '<div class="trk bad"><div class="tl">' + lines + '</div><b>تم إلغاء الطلب</b></div>';
    var sg = stageOf(o.status); if (sg == null) sg = 0;
    return '<div class="trk"><div class="tl">طاولة ' + ar(o.tableNo || '') + ' · ' + lines + '</div><div class="prog">' +
      STAGES.map(function (t, k) { return '<span' + (k <= sg ? ' class="on"' : '') + '>' + t + '</span>'; }).join('') + '</div></div>';
  }).join('');
}
function renderTrack() {
  var h = trackHtml();
  if ($('track')) $('track').innerHTML = h;
  if ($('done-track')) $('done-track').innerHTML = h;
}

/* ---- call waiter / bill ---- */
function callStaff(type, msgEl) {
  var say = function (t) { msgEl.textContent = t; msgEl.hidden = false; clearTimeout(say._t); say._t = setTimeout(function () { msgEl.hidden = true; }, 4000); };
  if (IS_PREVIEW) { say('معاينة فقط — ما ينرسل نداء.'); return; }
  if (!adId || !tableNo) return;
  var key = 'mosl-call-' + adId + '-' + type, now = Date.now(), last = 0;
  try { last = Number(localStorage.getItem(key)) || 0; } catch (e) {}
  if (now - last < 120000) { say('نداؤك وصل، انتظر لحظات.'); return; }
  ensureAuth().then(function (u) {
    return db.collection('calls').doc(adId + '_' + tableNo + '_' + type).set({ adId: adId, tableNo: tableNo, type: type, open: true, createdAt: now, customerUid: u.uid });
  }).then(function () {
    try { localStorage.setItem(key, String(now)); } catch (e) {}
    if (window.MPush) MPush.notify('call', adId + '_' + tableNo + '_' + type);
    if (type === 'leave') { try { localStorage.removeItem('chaychi-venue-tbl-' + adId); } catch (x) {} say('شكراً لزيارتك! نتمنى نشوفك قريباً 🌿'); }
    else say(type === 'bill' ? 'وصل طلب الحساب للموظف.' : 'وصل ندائك للموظف.');
  }).catch(function (e) {
    if (e && e.code === 'permission-denied') { try { localStorage.setItem(key, String(now)); } catch (x) {} say('نداؤك وصل وبانتظار الموظف.'); }
    else say('ما وصل النداء. تأكد من الإنترنت.');
  });
}

$('btn-change-tbl').addEventListener('click', function () {
  tableNo = 0; cart = {};
  $('menu').hidden = true; $('done').hidden = true; $('gate-table').hidden = false; $('bar').hidden = true; $('sheet').hidden = true;
  setStep(1); renderTables();
});

$('btn-more').addEventListener('click', function () {
  cart = {};
  showMenu();
});

$('btn-send').addEventListener('click', function () {
  if (!adId || !tableNo) return;
  var items = ad.items || [];
  var lines = [];
  items.forEach(function (it, i) {
    var q = cart[i] || 0;
    if (q > 0) lines.push({ id: String(i), n: it.name, q: q, p: Number(it.price) || 0 });
  });
  if (!lines.length) { $('err').textContent = 'اختار شيء من القائمة.'; return; }
  var qty = lines.reduce(function (t, l) { return t + l.q; }, 0);
  var total = cartTotal();
  var now = Date.now();
  $('err').textContent = '';
  $('btn-send').disabled = true;
  ensureAuth().then(function (u) {
    var doc = {
      kind: 'venue', adId: adId, customerUid: u.uid, sellerId: 'venue_' + adId,
      sellerName: ad.shop || '', tableNo: tableNo, zone: (ad.zones && ad.zones[0]) || '',
      lines: lines, total: total, qty: qty, phone: 'none',
      loc: 'طاولة ' + tableNo, lat: null, lng: null, pay: 'now',
      status: 'new', open: true, collectCalled: false,
      createdAt: now, statusAt: now, day: new Date().toISOString().slice(0, 10)
    };
    return db.collection('orders').add(doc);
  }).then(function (ref) {
    if (window.MPush && !IS_PREVIEW && ref) MPush.notify('order', ref.id);
    cart = {}; $('sheet').hidden = true;
    $('menu').hidden = true; $('bar').hidden = true; $('done').hidden = false;
    $('done-tbl').textContent = ar(tableNo);
    setStep(3); renderTrack();
    $('btn-send').disabled = false;
  }).catch(function (e) {
    $('btn-send').disabled = false;
    $('err').textContent = (e && e.message) || 'ما انرسل الطلب. حاول مرة ثانية.';
  });
});

$('q').addEventListener('input', function () { searchQ = $('q').value; renderMenu(); });
$('btn-send2').addEventListener('click', function () { $('sheet').hidden = true; $('btn-send').click(); });
$('sheet').addEventListener('click', function (e) { if (e.target === $('sheet')) $('sheet').hidden = true; });
document.addEventListener('click', function (e) {
  var t = e.target.closest('[data-act]');
  if (!t) return;
  var a = t.dataset.act, i = Number(t.dataset.i);
  if (a === 'inc') { cart[i] = Math.min((cart[i] || 0) + 1, 99); refreshAll(); }
  else if (a === 'dec') { cart[i] = Math.max((cart[i] || 0) - 1, 0); refreshAll(); }
  else if (a === 'cat') { curCat = t.dataset.c || ''; renderMenu(); }
  else if (a === 'tbl') { pickTable(Number(t.dataset.n)); }
  else if (a === 'call') { callStaff(t.dataset.t, !$('done').hidden ? $('callmsg2') : $('callmsg')); }
  else if (a === 'cart-open') { if (cartCount()) { renderSheet(); $('sheet').hidden = false; } }
  else if (a === 'cart-close') { $('sheet').hidden = true; }
});

(function () {
  var q = new URLSearchParams(location.search).get('a') || '';
  if (q) loadVenue(q);
  else $('vsub').textContent = 'افتح الرابط الكامل اللي وصلك من الصالة.';
})();

// preview mode
(function () {
  var params = new URLSearchParams(location.search);
  if (params.get('preview') === '1') {
    var bar = document.getElementById('preview-bar');
    if (bar && window === window.top) bar.hidden = false;
    var sb = document.getElementById('btn-send');
    if (sb) sb.addEventListener('click', function (e) { e.stopImmediatePropagation(); e.preventDefault(); $('err').textContent = 'معاينة فقط — ما ينرسل طلب.'; }, true);
    var btn = document.getElementById('btn-back');
    if (btn) btn.addEventListener('click', function () {
      if (window.opener) { window.close(); }
      else { location.href = 'panel.html'; }
    });
  }
})();
</script>
<script>try { if (window.MPush) MPush.mount({ slot: 'push-slot', label: '🔔 نبّهني لما يجهز طلبي', skip: IS_PREVIEW }); } catch (e) {}</script>
